version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/benchmarks"
    schedule:
      interval: "monthly"
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "mysql"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "redis"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
          
